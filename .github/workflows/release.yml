name: Release

# Cria uma tag de versão (ex.: git tag v0.1.0 && git push origin v0.1.0) e este workflow
# gera o instalador do Windows e abre um RASCUNHO de release com ele anexado. Nada fica
# público até alguém revisar e clicar em "Publish release" no GitHub.
#
# Notas: se existir .github/release-notes/<tag>.md, ele vira o texto da release; as notas
# automáticas do GitHub (PRs e commits) entram logo depois.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versão vem do packageManager do package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A tag bate com a versão do package.json e do plugin
        shell: bash
        run: |
          app=$(node -p "require('./apps/desktop/package.json').version")
          plugin=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")
          if [ "v$app" != "$GITHUB_REF_NAME" ] || [ "v$plugin" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, mas package.json está em $app e plugin.json em $plugin"; exit 1
          fi
      - run: pnpm check
      - run: pnpm dist:win
      - name: Notas da release
        shell: bash
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then cp "$notes" release-body.md; else : > release-body.md; fi
          # sem assinatura digital, o hash é o jeito de conferir o download
          {
            echo ""
            echo "### SHA-256"
            echo '```'
            (cd apps/desktop/release && sha256sum *.exe)
            echo '```'
          } >> release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          # 0.x é beta: marca como pré-lançamento (também pra tags com sufixo, ex.: v1.0.0-rc.1)
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
