name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    env:
      # os checks não abrem o app; não precisa baixar o binário do Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versão vem do packageManager do package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Site (VitePress) compila sem links quebrados
        run: pnpm docs:build
      - name: Manifestos do plugin são JSON válido
        run: |
          for f in plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json .claude-plugin/marketplace.json assets/skins/*/skin.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok  $f"
          done
