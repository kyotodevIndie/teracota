name: Site (GitHub Pages)

# Publica o site (VitePress, pasta docs/) no GitHub Pages.
# Por enquanto só roda MANUALMENTE (Actions → "Site (GitHub Pages)" → Run workflow),
# pra nada ir ao ar sem aprovação. Depois do lançamento, dá pra publicar a cada push
# na main acrescentando:
#   push:
#     branches: [main]
#     paths: ['docs/**']
#
# Pré-requisito (uma vez): Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # "atualizado em" de cada página vem do histórico do git
      - uses: pnpm/action-setup@v4 # versão vem do packageManager do package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
