<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>Tera</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div id="sim-banner" data-testid="sim-banner" role="status" hidden>SIMULAÇÃO — nenhum agente real</div>
  <section id="agents" data-testid="agents" aria-labelledby="agents-title">
    <h2 id="agents-title">Agentes no terminal</h2>
    <p class="note">Conectado, o agente faz a Tera reagir enquanto você trabalha nele.</p>
    <ul id="agent-list"></ul>
  </section>
  <h2 class="section-title">Conversar por aqui</h2>
  <header id="setup">
    <div class="row">
      <select id="provider" data-testid="provider-select" aria-label="Agente"></select>
      <button id="pick" data-testid="pick-folder" type="button">Escolher pasta…</button>
    </div>
    <div id="provider-reason" class="note" hidden></div>
    <div id="folder" class="note" hidden></div>
    <div id="sessions" hidden>
      <select id="session-select" data-testid="session-select" aria-label="Sessão para retomar"></select>
      <button id="start" data-testid="new-session" type="button">Iniciar</button>
    </div>
  </header>

  <div id="statusbar" hidden>
    <span id="dot"></span><span id="status-text" data-testid="state"></span>
    <span class="spacer"></span>
    <button id="end" data-testid="end-session" type="button">Encerrar sessão</button>
  </div>

  <div id="error" data-testid="error" role="alert" hidden></div>
  <main id="history" data-testid="history" aria-live="polite"></main>

  <section id="permission" data-testid="permission" hidden>
    <strong>O agente pede permissão</strong>
    <div id="perm-tool"></div>
    <pre id="perm-detail"></pre>
    <div id="perm-warn" hidden>Fora da pasta do projeto</div>
    <div class="row">
      <button id="allow" data-testid="allow" type="button">Permitir</button>
      <button id="deny" data-testid="deny" type="button">Recusar</button>
    </div>
  </section>

  <footer id="composer" hidden>
    <textarea id="prompt" data-testid="prompt" rows="3" maxlength="20000" placeholder="Escreva um prompt (Ctrl+Enter envia)"></textarea>
    <div class="row">
      <button id="send" data-testid="send" type="button">Enviar</button>
      <button id="stop" data-testid="interrupt" type="button" hidden>Interromper</button>
      <span class="spacer"></span>
      <button id="collapse" data-testid="collapse" type="button">Recolher</button>
    </div>
  </footer>
  <div id="collapse-only" class="row"><span class="spacer"></span><button id="collapse2" data-testid="collapse-idle" type="button">Recolher</button></div>
  <script src="panel.js"></script>
</body>
</html>
