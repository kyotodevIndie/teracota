<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Inspeção do rig — Teracota (dev)</title>
  <style>
    body { margin: 0; font: 13px "Segoe UI", system-ui, sans-serif; color: #2b2230; background: #f3f0ee; display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
    #stage { width: 520px; height: 560px; background: repeating-conic-gradient(#e7e1dc 0 25%, #fff 0 50%) 0 0 / 24px 24px; border: 1px solid #d6cdc6; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
    #character { transform: scale(2); transform-origin: 50% 100%; margin-bottom: 20px; }
    .sprite-character { position: relative; }
    .sprite-character canvas { width: 100%; height: 100%; display: block; }
    .sprite-character .prop { position: absolute; top: 10%; right: 16%; font-size: 26px; }
    #panel { min-width: 280px; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
    fieldset { border: 1px solid #d6cdc6; border-radius: 8px; }
    label { display: block; margin: 3px 0; }
    #hit { font-weight: 700; color: #b4532f; }
    pre { background: #fff; padding: 8px; border-radius: 6px; white-space: pre-wrap; margin: 0; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div id="stage"><div id="character"></div></div>
  <div id="panel">
    <strong>Rig experimental — camadas provisórias</strong>
    <fieldset>
      <legend>Visual</legend>
      <label><input type="checkbox" id="debug" checked /> pivôs e caixas</label>
      <label>Pose <select id="pose"></select></label>
      <label>Movimento
        <select id="motion"><option value="">parada</option><option value="walk">andando</option><option value="drag">arrastada (balanço simulado)</option></select>
      </label>
      <label><input type="checkbox" id="left" /> andando pra esquerda</label>
      <label>Expressão <select id="expression"></select></label>
      <label><input type="checkbox" id="talking" /> falando</label>
      <label><input type="checkbox" id="reduced" /> movimento reduzido</label>
    </fieldset>
    <fieldset>
      <legend>Clique (hitTest)</legend>
      Camada sob o cursor: <span id="hit">—</span>
    </fieldset>
    <fieldset>
      <legend>Desempenho</legend>
      <button id="bench" type="button">Medir (5 s de desenho + 10 mil hitTests)</button>
      <pre id="perf">—</pre>
    </fieldset>
    <pre id="log"></pre>
  </div>
  <script src="inspect.js"></script>
</body>
</html>
