packages:
  - apps/*
  - packages/*

# Scripts de instalação liberados (o resto fica bloqueado):
# - electron: baixa e confere (checksum) o binário do Electron
# - esbuild: instala o binário nativo do bundler
# - node-pty: terminal embutido (usa o binário pré-compilado; compila só se faltar)
# O electron-winstaller (Squirrel) não é usado: o instalador do Windows é NSIS.
allowBuilds:
  electron: true
  esbuild: true
  node-pty: true
  electron-winstaller: false

# Correções de segurança em dependências transitivas do MCP SDK (que vai no bundle do
# app), dentro da mesma major. Remover quando o MCP SDK já trouxer essas versões.
overrides:
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
  hono: ^4.13.11
  '@hono/node-server': ^2.1.3
  ip-address: ^10.7.4
  qs: ^6.16.1
