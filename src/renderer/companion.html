<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:" />
  <title>Teracota</title>
  <link rel="stylesheet" href="companion.css" />
</head>
<body>
  <div id="card" class="anchor-right" data-state="MINI">
    <button id="tera" type="button" aria-label="Tera: clique para abrir ou fechar">
      <img id="frame" alt="" draggable="false" />
      <span id="activity" hidden></span>
      <span id="badge" hidden></span>
    </button>
    <div id="content" aria-live="polite">
      <div id="info">
        <div id="origin"></div>
        <div id="head"><span id="title"></span><span id="count" hidden></span></div>
        <div id="message"></div>
      </div>
      <div id="drop" hidden><strong id="drop-hint"></strong><span id="drop-note"></span></div>
      <div id="actions"></div>
    </div>
  </div>
  <script src="companion.js"></script>
</body>
</html>
